<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Interactive Crossword with Picture Clues</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<h1>Interactive Crossword Puzzle</h1>

<div id="grid"></div>

<div id="clues">

  <h2>Across</h2>
  <ul id="across"></ul>

  <h2>Down</h2>
  <ul id="down"></ul>

  <!-- Picture clues will appear here -->
  <div id="pictureClues"></div>

</div>

<button id="checkButton">Check Answers</button>

<script src="script.js"></script>
</body>
</html>
