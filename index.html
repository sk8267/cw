<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Puzzle</title>

  <!-- Link to CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Crossword container (used to scale the puzzle smaller) -->
  <div id="crosswordContainer">

    <!-- Across picture clues -->
    <div id="pictureCluesAcross"></div>

    <!-- Crossword grid -->
    <div id="grid"></div>

    <!-- Down picture clues -->
    <div id="pictureCluesDown"></div>

    <!-- Check button -->
    <div id="controls">
      <button id="checkButton">Check</button>
    </div>

  </div>

  <!-- Link to JavaScript -->
  <script src="script.js"></script>

</body>
</html>
