<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Picture Crossword</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="crosswordContainer">

  <!-- Across pictures (left column) -->
  <div id="acrossPicsContainer" class="picsColumn">
    <div id="pictureCluesAcross" class="pictureClues"></div>
  </div>

  <!-- Crossword grid (middle) -->
  <div id="gridContainer">
    <div id="grid"></div>
  </div>

  <!-- Down pictures (right column) -->
  <div id="downPicsContainer" class="picsColumn">
    <div id="pictureCluesDown" class="pictureClues"></div>
  </div>

</div>

<button id="checkButton">Check Answers</button>

<script src="script.js"></script>
</body>
</html>
